<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css"><style>html,body{margin:0}</style></head><body>
<div id="stage"><canvas id="game"></canvas><div id="hud" class="hidden"></div></div>
<script src="js/i18n.js"></script><script src="js/audio.js"></script>
<script src="js/biomes.js"></script><script src="js/skins.js"></script>
<script src="js/courses.js"></script><script src="js/game.js"></script>
<script>
window.Sfx=new Proxy({},{get:function(){return function(){};}});
var q=new URLSearchParams(location.search);
Game.start(0,{hud:function(){},over:function(){}}, q.get('s')||'snowcap', q.get('c')||null);
Game.resize();
var K=Game._consts();
function steer(){var w=Game.debug(); if(!w||w.state!=='run')return;
  var row=null; for(var j=0;j<w.rows.length;j++) if(w.rows[j].d>w.dist+30){row=w.rows[j];break;}
  if(!row)return; var t=Game._chuteAt(row.d)+row.gap;
  var fr=Math.max(1,Math.round((row.d-w.dist)/w.speed));
  function m(d){var x=w.px,v=w.vx,tr=Game._turnRate();
    for(var p=0;p<fr;p++){v+=(d*K.DRIFT*w.speed-v)*tr;x+=v;}return Math.abs(x-t);}
  if(m(-w.dir)<m(w.dir)-6) Game.tap();}
var want=+(q.get('gap')||300), look=q.get('t')||'crevasse';
for(var f=0;f<60000;f++){
  var w=Game.debug(); if(!w||w.state!=='run')break;
  var cr=null;
  for(var i=0;i<w.objects.length;i++) if(w.objects[i].t===look){cr=w.objects[i];break;}
  if(cr && cr.d - w.dist < want) break;
  steer(); Game._step(1);
}
Game._render();
</script></body></html>
